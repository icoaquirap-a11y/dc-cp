<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una flor para ti 🌻</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0e1018;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f1ede3;
      font-family: sans-serif;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 20px;
      text-align: center;
      font-size: 18px;
      color: #f0b429;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="info">Toca la pantalla para abrir la flor ✨</div>

  <script>
    let size = 0;
    let targetSize = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      angleMode(DEGREES);
    }

    function draw() {
      background(14, 16, 24);
      translate(width / 2, height / 2);

      // Suavizado del crecimiento al tocar
      size = lerp(size, targetSize, 0.05);

      // Dibujar tallo
      stroke(46, 117, 89);
      strokeWeight(8);
      line(0, 0, 0, height / 2);

      // Dibujar flor tipo girasol
      noStroke();
      fill(236, 124, 82);

      let totalPetals = 160;
      for (let i = 0; i < totalPetals; i++) {
        let r = (i * 2) * (size / 100);
        let angle = i * 137.5;
        let x = r * cos(angle);
        let y = r * sin(angle);

        fill(240, 180, 41, 200);
        ellipse(x, y, 12 * (size / 100), 12 * (size / 100));
      }

      // Centro de la flor
      fill(80, 45, 22);
      circle(0, 0, 30 * (size / 100));
    }

    function touchStarted() {
      targetSize = 100;
      document.getElementById('info').innerText = "🌻 ¡Para ti! 🌻";
    }

    function mousePressed() {
      touchStarted();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
